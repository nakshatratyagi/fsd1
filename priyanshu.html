    // ==========================================

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.sirenOsc = null;
        this.sirenGain = null;
        this.active = false;
        this.interval = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playChime(freq = 880, dur = 150) {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur/1000);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur/1000);
        } catch(e) {}
      }
      startSiren() {
        if (this.active) return;
        this.init();
        if (!this.ctx) return;
        try {
          this.active = true;
          this.sirenOsc = this.ctx.createOscillator();
          this.sirenGain = this.ctx.createGain();
          this.sirenOsc.type = 'sawtooth';
          this.sirenGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          this.sirenOsc.connect(this.sirenGain);
          this.sirenGain.connect(this.ctx.destination);
          let freq = 600;
          let up = true;
          this.sirenOsc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          this.sirenOsc.start();
          this.interval = setInterval(() => {
            if (!this.ctx || !this.sirenOsc) return;
            if (up) { freq += 45; if (freq >= 1200) up = false; }
            else { freq -= 45; if (freq <= 500) up = true; }
            this.sirenOsc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          }, 35);
        } catch(e) {}
      }
      stopSiren() {
        if (!this.active) return;
        this.active = false;
        if (this.interval) clearInterval(this.interval);
        if (this.sirenOsc) {
          try { this.sirenOsc.stop(); this.sirenOsc.disconnect(); } catch(e) {}
          this.sirenOsc = null;
        }
      }
      speak(text, lang = 'en') {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
        utt.rate = 0.95;
        window.speechSynthesis.speak(utt);
      }
      stopSpeaking() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }
    const sound = new SoundEngine();

    function parseOfflineAI(input) {
      const q = input.toLowerCase();
      if (q.includes('pani') || q.includes('paani') || q.includes('flood') || q.includes('water') || q.includes('बाढ़') || q.includes('पानी')) {
        const trapped = q.includes('fasa') || q.includes('trapped') || q.includes('roof') || q.includes('छत') || q.includes('2nd');
        return {
          title: trapped ? '⚠️ TRAPPED IN RISING WATER EMERGENCY' : '⚠️ FLOOD & RISING WATER PROTOCOL',
          titleHi: trapped ? '⚠️ बाढ़ में फंसे होने की आपातकालीन स्थिति' : '⚠️ बाढ़ आपातकालीन सुरक्षा निर्देश',
          urgency: 'CRITICAL',
          steps: trapped ? [
            'Move immediately to rooftop or highest accessible elevation',
            'Wave bright colored cloth or blow whistle in bursts of 3 (SOS signal)',
            'Disconnect main circuit breaker; ensure no wires touch water near you'
          ] : [
            'Move valuable items and survival kit to upper floors immediately',
            'Disconnect main power breaker if safe to do so',
            'Do not walk, swim, or drive through moving water under any condition'
          ],
          donts: ['Never drive into submerged underpasses', 'Never touch electrical devices while wet', 'Do not drink unboiled floodwater']
        };
      }
      if (q.includes('aag') || q.includes('fire') || q.includes('smoke') || q.includes('dhuan') || q.includes('आग')) {
        return {
          title: '🚨 FIRE OUTBREAK PROTOCOL',
          titleHi: '🚨 आग लगने पर आपातकालीन निर्देश',
          urgency: 'CRITICAL',
          steps: [
            'Crawl low under the smoke layer on hands and knees (clean air is near floor)',
            'Feel doorknobs with back of hand; if hot, DO NOT open',
            'Evacuate immediately via stairs and dial 101/112',
            'Seal door gaps with damp towels if trapped and signal from window'
          ],
          donts: ['DO NOT use elevators', 'DO NOT re-enter burning building for possessions', 'DO NOT throw water on electrical fires']
        };
      }
      if (q.includes('bleed') || q.includes('khoon') || q.includes('खून') || q.includes('wound') || q.includes('cut')) {
        return {
          title: '🩸 SEVERE BLEEDING PROTOCOL',
          titleHi: '🩸 गंभीर रक्तस्राव प्राथमिक उपचार',
          urgency: 'CRITICAL',
          steps: [
            'Apply direct firm pressure with a clean cloth or sterile gauze without releasing',
            'Elevate the bleeding limb above heart level to reduce arterial pressure',
            'Keep patient lying down to prevent shock; call 108/112 immediately',
            'Apply tourniquet 2-3 inches above wound if limb hemorrhage is uncontrolled'
          ],
          donts: ['DO NOT remove blood-saturated bandages; add more layers on top', 'DO NOT remove embedded knives or glass shards']
        };
      }
      return {
        title: '🚨 GENERAL EMERGENCY RESPONSE PROTOCOL',
        titleHi: '🚨 सामान्य आपातकालीन सुरक्षा निर्देश',
        urgency: 'HIGH',
        steps: [
          'Assess immediate physical surroundings for falling debris, electrical wires, or rising water',
          'Seek reinforced interior shelter away from exterior glass windows',
          'Activate SOS or dial unified national helpline 112 with exact GPS pin'
        ],
        donts: ['DO NOT panic; focus on physical protection', 'DO NOT touch dangling roadside powerlines']
      };
    }

                      <button key={i} onClick={() => { setAiQuery(prompt); handleAiAnalyze(prompt); }} className="text-[10px] font-semibold px-2.5 py-1 bg-slate-900/90 border border-purple-800 text-purple-200 rounded-lg">
                        {prompt}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Input Bar */}
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={aiQuery}
                    onChange={e => setAiQuery(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleAiAnalyze()}
                    placeholder="Describe emergency in Hindi or English..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-purple-500"
                  />
                  <button onClick={() => handleAiAnalyze()} className="px-4 py-3 bg-purple-600 text-white font-bold text-xs rounded-xl">Analyze</button>
                </div>

                {/* Output result */}
                {aiResult && (
                  <div className="p-4 rounded-2xl bg-[#141624] border border-purple-800/80 space-y-3">
                    <div className="flex justify-between items-start">
                      <h3 className="text-sm font-black text-white">{lang === 'en' ? aiResult.title : aiResult.titleHi}</h3>
                      <span className="text-[10px] font-bold px-2 py-0.5 bg-purple-950 text-purple-300 rounded border border-purple-800">98% Match</span>
                    </div>

                    <div className="space-y-2">
                      {aiResult.steps.map((st, i) => (
                        <div key={i} className="p-2.5 bg-slate-900/90 rounded-xl border border-slate-800 text-xs text-slate-200 flex items-start gap-2.5">
                          <span className="w-5 h-5 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">{i+1}</span>
                          <span>{st}</span>
                        </div>
                      ))}
                    </div>

                    <div className="p-3 bg-red-950/30 rounded-xl border border-red-800/60 text-xs text-red-200">
                      <div className="font-bold text-red-400 mb-1">CRITICAL DO NOTS:</div>
                      {aiResult.donts.map((d, i) => <div key={i}>❌ {d}</div>)}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: SAFE PLACES MAP */}
            {!subView && tab === 'map' && (
              <div className="space-y-3 animate-fadeIn">
                <div className="flex justify-between items-center">
                  <h2 className="text-base font-black text-white">{t.safePlaces}</h2>
                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">Vector Tiles Cached</span>
                </div>
                <div ref={mapRef} className="w-full h-80 rounded-2xl border border-slate-800 overflow-hidden bg-slate-950"></div>
                <div className="p-3.5 rounded-2xl bg-emerald-950/40 border border-emerald-800 space-y-1">
                  <div className="text-[10px] font-bold uppercase text-emerald-400">Nearest Safe Haven</div>
                  <div className="font-bold text-white text-sm">Thyagaraj Multi-Purpose Relief Shelter</div>
                  <div className="text-xs text-slate-300">1.2 km away • Capacity 3500 • Medical & Food Ready ✅</div>
                  <a href="tel:011-24601111" className="inline-block mt-2 px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">Call Shelter</a>
                </div>
              </div>
            )}
          </main>

          {/* --- BOTTOM NAVIGATION BAR --- */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0c0d14]/95 backdrop-blur-lg border-t border-slate-800 p-2 flex justify-around items-center z-40">
            <button onClick={() => { setTab('home'); setSubView(null); }} className={`flex flex-col items-center text-xs font-bold ${tab === 'home' ? 'text-red-400' : 'text-slate-400'}`}>
              <span className="text-lg">🏠</span>
              <span className="text-[10px]">Home</span>
            </button>

            <button onClick={() => { setTab('emergency'); setSubView(null); }} className="relative -top-3 flex flex-col items-center">
              <div className="w-13 h-13 p-3 bg-red-600 rounded-2xl text-white shadow-lg shadow-red-600/50 flex items-center justify-center font-bold text-xl">
                🚨
              </div>
              <span className="text-[10px] font-bold text-red-400 mt-0.5">Emergency</span>
            </button>

            <button onClick={() => { setTab('ai'); setSubView(null); }} className={`flex flex-col items-center text-xs font-bold ${tab === 'ai' ? 'text-purple-400' : 'text-slate-400'}`}>
              <span className="text-lg">🧠</span>
              <span className="text-[10px]">AI Assist</span>
            </button>

            <button onClick={() => { setTab('map'); setSubView(null); }} className={`flex flex-col items-center text-xs font-bold ${tab === 'map' ? 'text-blue-400' : 'text-slate-400'}`}>
              <span className="text-lg">📍</span>
              <span className="text-[10px]">Map</span>
            </button>
          </nav>

          {/* --- FULLSCREEN SOS MODAL --- */}
          {sosOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl p-4 flex flex-col justify-between">
              <div className="flex justify-between items-center pt-2">
                <span className="text-xs font-black text-red-500 uppercase">🚨 EMERGENCY SOS ACTIVATED</span>
                <button onClick={() => { sound.stopSiren(); setSosOpen(false); }} className="px-3 py-1 bg-slate-800 text-slate-200 text-xs font-bold rounded-lg">Close</button>
              </div>

              <div className="text-center space-y-4 my-auto">
                <div className="w-36 h-36 mx-auto rounded-full bg-red-600 flex items-center justify-center text-white font-black text-4xl shadow-2xl animate-pulse">
                  SOS
                </div>
                <h2 className="text-xl font-black text-white">GPS Distress Coordinates Locked</h2>
                <div className="inline-block p-2 bg-slate-900 rounded-xl text-xs text-slate-300 font-mono">
                  📍 28.5700° N, 77.2154° E (Accuracy ±5m)
                </div>

                <div className="grid grid-cols-2 gap-2 max-w-xs mx-auto pt-2">
                  <a href={`https://api.whatsapp.com/send?text=${encodeURIComponent("🚨 EMERGENCY SOS! I need rescue. GPS: 28.5700, 77.2154 https://maps.google.com/?q=28.5700,77.2154")}`} target="_blank" className="p-3 bg-emerald-600 text-white font-bold text-xs rounded-xl text-center">WhatsApp SOS</a>
                  <a href="sms:112?body=EMERGENCY%20SOS%20GPS%2028.5700,%2077.2154" className="p-3 bg-blue-600 text-white font-bold text-xs rounded-xl text-center">SMS to 112</a>
                </div>

                <button onClick={handleToggleSiren} className="w-full py-3 bg-slate-800 text-amber-400 font-bold text-xs rounded-xl border border-slate-700">
                  {sirenActive ? 'Mute Siren Tone' : '🔊 Play High-Decibel Siren'}
                </button>
              </div>

              <div className="text-center text-xs text-slate-500 pb-2">
                Offline Auto-Sync Queue: Active • SDRF Emergency Mesh
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
